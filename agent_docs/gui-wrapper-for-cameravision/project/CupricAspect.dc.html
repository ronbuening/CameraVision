<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;padding:0}</style>
</helmet>

<sc-if value="{{ isStudio }}" hint-placeholder-val="{{ false }}">
  <dc-import name="CupricAspect Studio" theme="{{ theme }}" accent="{{ accent }}" reduce-motion="{{ reduceMotion }}" nonlinear="{{ true }}" on-set-nonlinear="{{ setNonlinear }}" hint-size="100%,100%"></dc-import>
</sc-if>
<sc-if value="{{ isWizard }}" hint-placeholder-val="{{ true }}">
  <dc-import name="CupricAspect Wizard" theme="{{ theme }}" accent="{{ accent }}" reduce-motion="{{ reduceMotion }}" nonlinear="{{ false }}" on-set-nonlinear="{{ setNonlinear }}" hint-size="100%,100%"></dc-import>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;auto&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'|'auto'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;copper&quot;,&quot;amber&quot;,&quot;patina&quot;],&quot;default&quot;:&quot;copper&quot;,&quot;tsType&quot;:&quot;'copper'|'amber'|'patina'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
class Component extends DCLogic {
  state = { nonlinear: false };

  componentDidMount() {
    try {
      const v = localStorage.getItem('cupricaspect.nonlinear');
      if (v !== null) this.setState({ nonlinear: v === 'true' });
    } catch (e) {}
  }

  setNonlinear(v) {
    try { localStorage.setItem('cupricaspect.nonlinear', v ? 'true' : 'false'); } catch (e) {}
    this.setState({ nonlinear: !!v });
  }

  renderVals() {
    return {
      isStudio: this.state.nonlinear,
      isWizard: !this.state.nonlinear,
      theme: this.props.theme || 'light',
      accent: this.props.accent || 'copper',
      reduceMotion: !!this.props.reduceMotion,
      setNonlinear: (v) => this.setNonlinear(v),
    };
  }
}
</script>
</body>
</html>
